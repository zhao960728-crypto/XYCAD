<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XYCAD · CAD 图纸预览</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="viewer.mjs"></script>
</head>
<body>
  <header class="header">
    <div class="brand"><div class="brand-mark" aria-hidden="true">XY</div><div><h1>XYCAD</h1><p>二维图纸与三维模型预览</p></div></div>
    <div class="local"><span aria-hidden="true"></span> XYCAD 自托管解析</div>
  </header>
  <main class="workspace">
    <div class="toolbar" aria-label="图纸工具栏">
      <div class="tools">
        <button class="primary" id="open" type="button">打开图纸</button>
        <input id="file" type="file" hidden>
        <button id="sample" type="button">查看样图</button>
        <button id="cancel-load" type="button" hidden>取消载入</button>
        <button id="download" type="button" hidden>下载 DXF</button>
        <button id="download-pdf" type="button" title="导出当前可见图层或框选范围" hidden>转 PDF</button>
        <button id="pick-pdf-region" type="button" aria-pressed="false" hidden>框选 PDF 范围</button>
        <button id="clear-pdf-region" type="button" hidden>清除 PDF 范围</button><select id="drawing-pdf-paper" aria-label="转 PDF 纸张" hidden><option value="a4">A4</option><option value="a3">A3</option></select>
        <button id="make-projection" type="button" hidden>生成三视图</button>
        <button id="back-to-mesh" type="button" hidden>返回三维</button>
        <div id="projection-export" class="sheet-export" hidden>
          <label class="projection-hidden"><input id="projection-hidden" type="checkbox" checked> 遮挡线</label>
          <select id="projection-format" aria-label="选择三视图导出格式">
            <option value="dxf">可编辑 DXF</option>
            <option value="pdf">矢量 PDF</option>
          </select>
          <button id="download-projection" type="button">下载三视图 DXF</button>
        </div>
        <div id="sheet-export" class="sheet-export" hidden>
          <select id="sheet-format" aria-label="选择工程图导出格式">
            <option value="">选择导出格式</option>
            <option value="pdf">PDF</option>
            <option value="dxf">可编辑 DXF</option>
          </select>
          <button id="download-sheet" type="button" disabled>导出</button>
        </div>
        <label id="block-picker" hidden>图块 <select id="block-view" aria-label="选择图块预览"></select></label>
        <label id="part-config-picker" hidden>配置 <select id="part-configuration" aria-label="选择零件配置"></select></label>
      </div>
      <div class="tools view-tools">
        <select id="measure-mode" aria-label="测量工具" hidden><option value="">测量</option></select>
        <button id="toggle-weight" type="button" aria-controls="weight-panel" aria-expanded="false" hidden>材质 / 重量</button>
        <select id="mesh-view" aria-label="三维视角" hidden>
          <option value="iso">等轴测</option>
          <option value="front">正视</option>
          <option value="right">右视</option>
          <option value="top">俯视</option>
          <option value="custom" disabled>自由视角</option>
        </select>
        <button id="out" type="button" aria-label="缩小" disabled>−</button>
        <button id="in" type="button" aria-label="放大" disabled>+</button>
        <button id="fit" type="button" disabled>适合窗口</button>
      </div>
    </div>
    <section id="weight-panel" class="weight-panel" aria-label="材质和重量" hidden>
      <div class="weight-fields">
        <label>材质
          <select id="weight-material">
            <option value="">请选择</option>
            <option value="8.96">紫铜</option>
            <option value="2.70">铝材</option>
            <option value="7.85">碳钢</option>
            <option value="7.90">304 不锈钢</option>
            <option value="8.50">H62 黄铜</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label id="weight-density-field" hidden>密度 (g/cm³)
          <input id="weight-density" type="number" min="0" step="any" inputmode="decimal">
        </label>
        <label id="weight-unit-field" hidden>模型长度单位
          <select id="weight-unit">
            <option value="">请选择</option>
            <option value="mm">毫米</option>
            <option value="cm">厘米</option>
            <option value="m">米</option>
            <option value="in">英寸</option>
            <option value="ft">英尺</option>
            <option value="µm">微米</option>
          </select>
        </label>
        <label id="weight-area-field" hidden>净面积 (mm²)
          <input id="weight-area" type="number" min="0" step="any" inputmode="decimal">
        </label>
        <label id="weight-thickness-field" hidden>板厚 (mm)
          <input id="weight-thickness" type="number" min="0" step="any" inputmode="decimal">
        </label>
      </div>
      <div class="weight-readout">
        <output id="weight-result" role="status"></output>
        <small id="weight-note"></small>
      </div>
    </section>
    <div id="projection-settings" class="projection-settings" aria-label="三视图排版" hidden>
      <label>主视方向 <select id="projection-front" aria-label="三视图主视方向">
        <option value="auto">自动推荐</option><option value="ny">−Y</option><option value="py">+Y</option>
        <option value="nx">−X</option><option value="px">+X</option><option value="nz">−Z</option><option value="pz">+Z</option>
      </select></label>
      <label>视图转向 <select id="projection-turn" aria-label="三视图转向"><option value="auto">自动</option><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>
      <label>最小间距 <input id="projection-gap" type="number" min="0" max="10000" step="any" placeholder="自动" aria-label="三视图最小间距" title="单位为毫米；源模型未声明单位时按原坐标单位。视图标签另留位置。"></label>
      <label>PDF 纸张 <select id="projection-paper" aria-label="三视图纸张"><option value="auto">A4</option><option value="a3-auto">A3</option></select></label>
      <label title="显示原模型面分区之间的边界。默认隐藏内部辅助线；实体棱边、孔槽和折弯外轮廓保留。"><input id="projection-seams" type="checkbox"> 模型分区线</label>
      <details class="frame-fields"><summary>图框信息（已知信息自动带入，可补填）</summary><p>自动带入文件名、所选节点及模型外形尺寸。未提供的制造信息显示待核；圆孔及间距仅在可可靠识别时标注。</p><div><label>图号 <input data-frame-field="drawingNo" aria-label="图框图号" maxlength="240" placeholder="自动使用文件名"></label><label>零件名 <input data-frame-field="partName" aria-label="图框零件名" maxlength="240" placeholder="自动使用所选零件名"></label><label>材质 <input data-frame-field="material" aria-label="图框材质" maxlength="240" placeholder="待核"></label><label>厚度 <input data-frame-field="thickness" aria-label="图框厚度" maxlength="240" placeholder="待核"></label><label>数量 <input data-frame-field="quantity" aria-label="图框数量" maxlength="240" placeholder="待核"></label><label>表面处理 <input data-frame-field="surface" aria-label="图框表面处理" maxlength="240" placeholder="待核"></label><label>展开尺寸 <input data-frame-field="unfolded" aria-label="图框展开尺寸" maxlength="240" placeholder="待核"></label><label>技术要求 <input data-frame-field="requirements" aria-label="图框技术要求" maxlength="240" placeholder="待核"></label><label>工艺流程 <input data-frame-field="process" aria-label="图框工艺流程" maxlength="240" placeholder="待核"></label><label>折弯系数 <input data-frame-field="bendFactor" aria-label="图框折弯系数" maxlength="240" placeholder="待核"></label><label>质量 <input data-frame-field="mass" aria-label="图框质量" maxlength="240" placeholder="待核"></label></div></details>
      <span id="projection-layout-info" role="status">第一角法；可在推荐方案上手动调整。</span>
    </div>
    <div class="file-bar"><strong id="file-name">尚未打开图纸</strong><span id="file-meta"></span></div>
    <section id="measure-panel" class="measure-panel" aria-label="测量结果" hidden>
      <div><output id="measure-result" role="status" aria-live="polite"></output><small id="measure-caption"></small></div>
      <div class="tools">
        <label class="measure-snap"><input id="measure-snap" type="checkbox" checked> 吸附</label>
        <label id="measure-scale-label" class="measure-snap" hidden>视图比例 1∶<input id="measure-scale" type="number" value="1" min="0.000001" max="1000000" step="any" aria-label="视图比例中对应的模型尺寸"></label>
        <button id="measure-close" type="button" hidden>闭合面积</button>
        <button id="measure-undo" type="button">撤销点</button>
        <button id="measure-clear" type="button">清除</button>
      </div>
    </section>
    <div id="message" class="message" role="status" hidden></div>
    <div id="work-area" class="work-area">
      <section id="viewport" class="viewport" aria-label="图纸预览区">
        <svg id="pdf-region-overlay" aria-hidden="true" hidden><rect id="pdf-region-box" hidden></rect></svg>
        <svg id="drawing" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CAD 图纸预览" viewBox="0 0 100 100">
          <g id="world" transform="scale(1 -1)"></g>
        </svg>
        <canvas id="drawing-motion" aria-hidden="true" hidden></canvas>
        <canvas id="mesh-canvas" role="img" aria-label="三维模型预览" hidden></canvas>
        <svg id="measure-overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        <div id="empty" class="empty">
          <svg width="66" height="66" viewBox="0 0 66 66" fill="none" aria-hidden="true">
            <rect x="10" y="10" width="46" height="46" rx="10" stroke="currentColor" opacity=".35"/>
            <path d="M21 46V22m0 24h24M25 40l8-12 7 7 6-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2 id="empty-title">将图纸拖到此处</h2>
          <p id="empty-note">请选择非空 CAD 文件</p>
        </div>
        <div id="drop" class="drop" hidden>松开以打开图纸</div>
        <div class="axis" id="axis" aria-hidden="true">↗ XY</div>
      </section>
      <aside class="sidebar" aria-labelledby="layers-title">
        <div class="sidebar-title"><h2 id="layers-title">图层</h2><span id="layer-count">0</span></div>
        <div id="layer-controls" class="layer-controls" hidden>
          <button type="button" id="show-layers">全显</button>
          <button type="button" id="hide-layers">全隐藏</button>
          <button type="button" id="reset-layers">恢复原始</button>
        </div>
        <p id="layers-empty" class="layers-empty">打开图纸后显示图层。</p>
        <div id="sheet-controls" class="sheet-controls" hidden>
          <select id="sheet-view" aria-label="选择工程图纸页"></select>
          <div>
            <button id="previous-sheet" type="button">上一页</button>
            <button id="next-sheet" type="button">下一页</button>
          </div>
        </div>
        <dl id="mesh-info" hidden>
          <dt title="X × Y × Z">外包尺寸</dt><dd id="mesh-size"></dd>
          <dt>长度单位</dt><dd id="mesh-unit"></dd>
        </dl>
        <div id="mesh-explosion" class="mesh-explosion" hidden>
          <label for="mesh-spread">爆炸视图</label>
          <output id="mesh-spread-value" for="mesh-spread">0%</output>
          <button id="mesh-reset-spread" type="button">复位</button>
          <input id="mesh-spread" type="range" min="0" max="100" value="0">
        </div>
        <div id="mesh-tree-controls" class="layer-controls" hidden>
          <button type="button" id="show-parts">全显</button>
          <button type="button" id="hide-parts">全隐藏</button>
        </div>
        <ul id="mesh-tree" class="mesh-tree" aria-label="装配结构" hidden></ul>
        <ul id="layers" class="layer-list"></ul>
      </aside>
    </div>
    <footer class="status"><span id="view-hints">模型空间 · 滚轮缩放 · 拖动平移 · 双击适配</span><span id="visible-count">等待图纸</span></footer>
    <details id="warnings" class="warnings" hidden><summary id="warning-summary">预览提示</summary><ul id="warning-list"></ul></details>
  </main>
</body>
</html>
